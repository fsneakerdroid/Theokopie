<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bildnamen kopieren</title>
<style>
:root {
  --bg: #eef1ef;
  --surface: #ffffff;
  --ink: #1b2826;
  --muted: #56655f;
  --accent: #0f6b63;
  --accent-ink: #ffffff;
  --line: #d3dad6;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a19; --surface: #1c2826; --ink: #eaf1ee; --muted: #9db0a9;
    --accent: #3fb8aa; --accent-ink: #08201d; --line: #2d3d3a;
  }
}
:root[data-theme="dark"] {
  --bg: #121a19; --surface: #1c2826; --ink: #eaf1ee; --muted: #9db0a9;
  --accent: #3fb8aa; --accent-ink: #08201d; --line: #2d3d3a;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
header { padding: 28px 24px 8px; max-width: 1200px; margin: 0 auto; }
h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -0.01em; }
header p { margin: 0; color: var(--muted); font-size: 1rem; }
main {
  max-width: 1200px; margin: 0 auto; padding: 20px 24px 96px;
  display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}
.tile {
  appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); border-radius: 14px;
  padding: 0; overflow: hidden; position: relative;
  transition: border-color .15s, transform .1s;
}
.tile:active { transform: scale(.98); }
.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tile img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: 50% 25%; background: var(--line); }
.tile span { display: block; padding: 12px 14px 14px; font-size: 1.05rem; font-weight: 600; overflow-wrap: anywhere; }
.tile.done { border-color: var(--accent); }
.tile .badge {
  position: absolute; top: 10px; right: 10px; padding: 6px 12px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font-size: .9rem; font-weight: 700;
  opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s; pointer-events: none;
}
.tile.done .badge { opacity: 1; transform: none; }
#toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 12px;
  font-weight: 600; max-width: 90vw; text-align: center; overflow-wrap: anywhere;
  transition: opacity .15s, transform .15s; pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Bildnamen kopieren</h1>
  <p>Tippe auf ein Bild, um seinen Namen in die Zwischenablage zu kopieren.</p>
</header>
<main id="grid"></main>
<div id="toast" role="status" aria-live="polite"></div>

var grid = document.getElementById('grid');
var toast = document.getElementById('toast');
var toastTimer;

function showToast(text) {
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(function () { return true; })
      .catch(function () { return fallbackCopy(text); });
  }
  return Promise.resolve(fallbackCopy(text));
}

IMAGES.forEach(function (item) {
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'tile';
  btn.setAttribute('aria-label', item.name + ' kopieren');
  var img = document.createElement('img');
  img.src = item.src;
  img.alt = '';
  var label = document.createElement('span');
  label.textContent = item.name;
  var badge = document.createElement('div');
  badge.className = 'badge';
  badge.textContent = 'Kopiert';
  btn.append(img, label, badge);
  btn.addEventListener('click', function () {
    copyText(item.name).then(function (ok) {
      if (ok) {
        document.querySelectorAll('.tile.done').forEach(function (t) { t.classList.remove('done'); });
        btn.classList.add('done');
        showToast('Kopiert: ' + item.name);
        setTimeout(function () { btn.classList.remove('done'); }, 1800);
      } else {
        showToast('Kopieren hat nicht geklappt');
      }
    });
  });
  grid.appendChild(btn);
});
</script>
